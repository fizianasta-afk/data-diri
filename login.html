<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

}

.container {

    width: 100%;

    max-width: 450px;

}

.box {

    background: white;

    padding: 35px;

    border-radius: 25px;

    box-shadow:
        0 20px 50px rgba(
            0,
            0,
            0,
            0.2
        );

}

.logo {

    text-align: center;

    font-size: 65px;

    margin-bottom: 10px;

}

h1 {

    text-align: center;

    color: #333;

    margin-bottom: 8px;

}

.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;

}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 7px;

    font-weight: bold;

    color: #333;

}

input {

    width: 100%;

    padding: 14px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

    outline: none;

}

input:focus {

    border-color: #667eea;

}

.input-group {

    display: flex;

    gap: 8px;

}

.input-group input {

    flex: 1;

}

.show {

    width: auto;

    margin: 0;

    padding: 10px 14px;

    background: #777;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 20px;

    border: none;

    border-radius: 11px;

    background: #667eea;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #5568d9;

}

.register {

    text-align: center;

    margin-top: 20px;

    color: #777;

}

.register a {

    color: #667eea;

    font-weight: bold;

    text-decoration: none;

}

.info {

    background: #f3f4ff;

    padding: 14px;

    border-radius: 10px;

    margin-top: 18px;

    font-size: 13px;

    color: #555;

    line-height: 1.5;

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<div class="logo">
🔐
</div>


<h1>
Login
</h1>


<p class="subtitle">
Masuk ke Website Data Diri
</p>


<form
    id="loginForm"
>


<label>
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Masukkan email"
    required
>


<label>
Password
</label>

<div class="input-group">

<input
    type="password"
    id="password"
    placeholder="Masukkan password"
    required
>

<button
    type="button"
    class="show"
    onclick="lihatPassword()"
>
👁️
</button>

</div>


<button
    type="submit"
>

🔓 MASUK

</button>


</form>


<div class="info">

💡 Gunakan email dan password
yang kamu buat saat register.

</div>


<div class="register">

Belum punya akun?

<a href="index.html">
Daftar sekarang
</a>

</div>


</div>

</div>


<script>


/* =========================
   LOGIN
========================= */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value
            .trim()
            .toLowerCase();


        const password =
            document.getElementById(
                "password"
            ).value;


        const data =
            JSON.parse(
                localStorage.getItem(
                    "dataDiri"
                )
            );


        if (!data) {

            alert(
                "❌ Akun belum terdaftar."
            );

            return;

        }


        if (
            email !== data.email
        ) {

            alert(
                "❌ Email tidak ditemukan."
            );

            return;

        }


        if (
            password !== data.password
        ) {

            alert(
                "❌ Password salah."
            );

            return;

        }


        localStorage.setItem(
            "login",
            "true"
        );


        alert(
            "✅ Login berhasil!"
        );


        window.location.href =
            "dashboard.html";

    }
);


/* =========================
   LIHAT PASSWORD
========================= */

function lihatPassword() {

    const input =
        document.getElementById(
            "password"
        );


    if (
        input.type === "password"
    ) {

        input.type =
            "text";

    }

    else {

        input.type =
            "password";

    }

}

</script>


</body>

</html>
