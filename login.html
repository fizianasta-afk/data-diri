<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Data Diri</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .register {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .register a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .logo {
            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        👤
    </div>

    <h1>Selamat Datang</h1>

    <p class="subtitle">
        Masuk ke Data Diri
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
        >

        <button type="submit">
            🔐 MASUK
        </button>

    </form>

    <div class="register">

        Belum punya akun?

        <a href="index.html">
            Daftar
        </a>

    </div>

</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    const data =
        JSON.parse(
            localStorage.getItem("dataDiri")
        );


    if (!data) {

        alert(
            "❌ Belum ada akun. Silakan daftar terlebih dahulu."
        );

        return;

    }


    if (
        email === data.email &&
        password === data.password
    ) {

        localStorage.setItem(
            "login",
            "true"
        );

        alert(
            "✅ Login berhasil!"
        );

        window.location.href =
            "dashboard.html";

    } else {

        alert(
            "❌ Email atau password salah!"
        );

    }

});

</script>

</body>

</html>
