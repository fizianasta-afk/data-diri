<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Data Diri</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

        }

        .container {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 22px;

            box-shadow:
                0 20px 50px rgba(
                    0,
                    0,
                    0,
                    0.2
                );

        }

        .logo {

            text-align: center;

            font-size: 60px;

            margin-bottom: 10px;

        }

        h1 {

            text-align: center;

            color: #333;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }

        input:focus {

            border-color: #667eea;

        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 11px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #5568d9;

        }

        .register {

            text-align: center;

            margin-top: 20px;

            color: #777;

        }

        .register a {

            color: #667eea;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🔐
    </div>


    <h1>
        Selamat Datang
    </h1>


    <p class="subtitle">
        Masuk ke Website Data Diri
    </p>


    <form id="loginForm">


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
        >


        <button type="submit">

            🔓 MASUK

        </button>


    </form>


    <div class="register">

        Belum punya akun?

        <a href="index.html">
            Daftar
        </a>

    </div>


</div>


<script>


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const data =
            JSON.parse(
                localStorage.getItem(
                    "dataDiri"
                )
            );


        if (!data) {

            alert(
                "❌ Akun belum tersedia. Silakan daftar."
            );

            window.location.href =
                "index.html";

            return;

        }


        if (
            email === data.email &&
            password === data.password
        ) {

            localStorage.setItem(
                "login",
                "true"
            );


            alert(
                "✅ Login berhasil!"
            );


            window.location.href =
                "dashboard.html";


        } else {

            alert(
                "❌ Email atau password salah!"
            );

        }

    }

);

</script>


</body>

</html>
