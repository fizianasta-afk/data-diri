<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Profil & Pengaturan</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    padding: 25px;

}

.container {

    width: 100%;

    max-width: 650px;

    margin: auto;

}

.box {

    background: white;

    padding: 30px;

    border-radius: 22px;

    box-shadow:
        0 20px 50px rgba(
            0,
            0,
            0,
            0.2
        );

}

.icon {

    text-align: center;

    font-size: 60px;

    margin-bottom: 10px;

}

h1 {

    text-align: center;

    color: #333;

    margin-bottom: 8px;

}

.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;

}

.section {

    margin-top: 25px;

    padding-top: 20px;

    border-top: 1px solid #eee;

}

.section h2 {

    color: #667eea;

    margin-bottom: 15px;

    font-size: 20px;

}

label {

    display: block;

    margin-top: 14px;

    margin-bottom: 7px;

    font-weight: bold;

    color: #333;

}

.input-group {

    display: flex;

    gap: 8px;

}

.input-group input {

    flex: 1;

}

input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ddd;

    border-radius: 10px;

    outline: none;

    font-size: 15px;

}

input:focus {

    border-color: #667eea;

}

.show {

    width: auto;

    margin: 0;

    padding: 10px 14px;

    background: #777;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 18px;

    border: none;

    border-radius: 11px;

    background: #667eea;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #5568d9;

}

.save-pin {

    background: #2ecc71;

}

.back {

    background: #333;

}

.info {

    background: #f3f4ff;

    padding: 15px;

    border-radius: 12px;

    margin-top: 15px;

    color: #555;

    font-size: 13px;

    line-height: 1.5;

}

.danger {

    background: #e74c3c;

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<div class="icon">
👤
</div>


<h1>
Profil & Pengaturan
</h1>


<p class="subtitle">
Kelola data diri dan keamanan akun
</p>


<!-- DATA DIRI -->

<div class="section">

<h2>
👤 Data Diri
</h2>


<form id="profilForm">


<label>
Nama
</label>

<input
    type="text"
    id="nama"
    required
>


<label>
Sekolah
</label>

<input
    type="text"
    id="sekolah"
    required
>


<label>
Umur
</label>

<input
    type="number"
    id="umur"
    min="1"
    max="100"
    required
>


<label>
Cita-cita
</label>

<input
    type="text"
    id="cita"
    required
>


<label>
Hobi
</label>

<input
    type="text"
    id="hobi"
    required
>


<label>
Email
</label>

<input
    type="email"
    id="email"
    required
>


<label>
Password
</label>

<input
    type="password"
    id="password"
    required
>


<button type="submit">

💾 SIMPAN DATA DIRI

</button>


</form>

</div>


<!-- PIN -->

<div class="section">

<h2>
🔐 Ganti PIN
</h2>


<div class="info">

PIN digunakan untuk melindungi
halaman Jadwal dan Edit Jadwal.

<br><br>

Gunakan PIN yang mudah kamu ingat,
tetapi jangan berikan kepada orang lain.

</div>


<label>
PIN Jadwal Sekarang
</label>

<div class="input-group">

<input
    type="password"
    id="pinJadwal"
    maxlength="6"
    inputmode="numeric"
>

<button
    type="button"
    class="show"
    onclick="lihatPIN('pinJadwal')"
>
👁️
</button>

</div>


<label>
PIN Edit Jadwal Sekarang
</label>

<div class="input-group">

<input
    type="password"
    id="pinEdit"
    maxlength="6"
    inputmode="numeric"
>

<button
    type="button"
    class="show"
    onclick="lihatPIN('pinEdit')"
>
👁️
</button>

</div>


<button
    class="save-pin"
    onclick="simpanPIN()"
>

🔐 SIMPAN PIN BARU

</button>


</div>


<button
    class="back"
    onclick="kembali()"
>

← KEMBALI KE DASHBOARD

</button>


</div>

</div>


<script>


/* CEK LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* AMBIL DATA */

let data =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (!data) {

    alert(
        "❌ Data akun tidak ditemukan."
    );

    window.location.href =
        "login.html";

}


/* DATA DIRI */

document.getElementById(
    "nama"
).value =
    data.nama || "";


document.getElementById(
    "sekolah"
).value =
    data.sekolah || "";


document.getElementById(
    "umur"
).value =
    data.umur || "";


document.getElementById(
    "cita"
).value =
    data.cita || "";


document.getElementById(
    "hobi"
).value =
    data.hobi || "";


document.getElementById(
    "email"
).value =
    data.email || "";


document.getElementById(
    "password"
).value =
    data.password || "";


/* PIN */

document.getElementById(
    "pinJadwal"
).value =
    data.pinJadwal || "";


document.getElementById(
    "pinEdit"
).value =
    data.pinEdit || "";


/* SIMPAN DATA DIRI */

document
.getElementById("profilForm")
.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        data.nama =
            document.getElementById(
                "nama"
            ).value.trim();


        data.sekolah =
            document.getElementById(
                "sekolah"
            ).value.trim();


        data.umur =
            document.getElementById(
                "umur"
            ).value;


        data.cita =
            document.getElementById(
                "cita"
            ).value.trim();


        data.hobi =
            document.getElementById(
                "hobi"
            ).value.trim();


        data.email =
            document.getElementById(
                "email"
            ).value.trim();


        data.password =
            document.getElementById(
                "password"
            ).value;


        localStorage.setItem(
            "dataDiri",
            JSON.stringify(data)
        );


        alert(
            "✅ Data diri berhasil disimpan!"
        );

    }
);


/* SIMPAN PIN */

function simpanPIN() {


    const pinJadwal =
        document.getElementById(
            "pinJadwal"
        ).value;


    const pinEdit =
        document.getElementById(
            "pinEdit"
        ).value;


    /* VALIDASI */

    if (
        !/^[0-9]{4,6}$/.test(
            pinJadwal
        )
    ) {

        alert(
            "❌ PIN Jadwal harus 4-6 angka."
        );

        return;

    }


    if (
        !/^[0-9]{4,6}$/.test(
            pinEdit
        )
    ) {

        alert(
            "❌ PIN Edit harus 4-6 angka."
        );

        return;

    }


    if (
        pinJadwal === pinEdit
    ) {

        alert(
            "⚠️ Sebaiknya PIN Jadwal dan PIN Edit berbeda."
        );

        return;

    }


    data.pinJadwal =
        pinJadwal;


    data.pinEdit =
        pinEdit;


    localStorage.setItem(
        "dataDiri",
        JSON.stringify(data)
    );


    alert(
        "✅ PIN berhasil diperbarui!"
    );

}


/* LIHAT PIN */

function lihatPIN(id) {

    const input =
        document.getElementById(
            id
        );


    if (
        input.type === "password"
    ) {

        input.type =
            "text";

    }

    else {

        input.type =
            "password";

    }

}


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}

</script>


</body>

</html>
