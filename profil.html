<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Data Diri</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 25px;

        }

        .container {

            width: 100%;
            max-width: 600px;

            margin: auto;

        }

        .box {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);

        }

        .icon {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;

        }

        h1 {

            text-align: center;

            color: #333;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }

        input:focus {

            border-color: #667eea;

        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #5568d9;

        }

        .back {

            background: #333;

        }

        .danger {

            background: #e74c3c;

        }

        .danger:hover {

            background: #c0392b;

        }

        .info {

            background: #f3f4ff;

            padding: 15px;

            border-radius: 10px;

            margin-top: 20px;

            color: #555;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="box">


        <div class="icon">
            👤
        </div>


        <h1>
            Edit Data Diri
        </h1>


        <p class="subtitle">
            Ubah informasi pribadi kamu
        </p>


        <form id="profilForm">


            <label>
                Nama
            </label>

            <input
                type="text"
                id="nama"
                required
            >


            <label>
                Sekolah
            </label>

            <input
                type="text"
                id="sekolah"
                required
            >


            <label>
                Umur
            </label>

            <input
                type="number"
                id="umur"
                min="1"
                max="100"
                required
            >


            <label>
                Cita-cita
            </label>

            <input
                type="text"
                id="cita"
                required
            >


            <label>
                Hobi
            </label>

            <input
                type="text"
                id="hobi"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >


            <div class="info">

                🔐 PIN Jadwal dan PIN Edit Jadwal
                tidak diubah di halaman ini.

                <br><br>

                PIN tersebut tetap digunakan
                untuk mengamankan jadwal kamu.

            </div>


            <button type="submit">

                💾 SIMPAN PERUBAHAN

            </button>


        </form>


        <button
            class="back"
            onclick="kembali()"
        >

            ← KEMBALI KE DASHBOARD

        </button>


    </div>

</div>


<script>


/* CEK LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* AMBIL DATA */

let data =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (!data) {

    alert(
        "❌ Data diri tidak ditemukan."
    );

    window.location.href =
        "login.html";

}


/* TAMPILKAN DATA */

document.getElementById(
    "nama"
).value = data.nama || "";


document.getElementById(
    "sekolah"
).value = data.sekolah || "";


document.getElementById(
    "umur"
).value = data.umur || "";


document.getElementById(
    "cita"
).value = data.cita || "";


document.getElementById(
    "hobi"
).value = data.hobi || "";


document.getElementById(
    "email"
).value = data.email || "";


document.getElementById(
    "password"
).value = data.password || "";


/* SIMPAN */

document
.getElementById("profilForm")
.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        data.nama =
            document.getElementById(
                "nama"
            ).value.trim();


        data.sekolah =
            document.getElementById(
                "sekolah"
            ).value.trim();


        data.umur =
            document.getElementById(
                "umur"
            ).value;


        data.cita =
            document.getElementById(
                "cita"
            ).value.trim();


        data.hobi =
            document.getElementById(
                "hobi"
            ).value.trim();


        data.email =
            document.getElementById(
                "email"
            ).value.trim();


        data.password =
            document.getElementById(
                "password"
            ).value;


        localStorage.setItem(
            "dataDiri",
            JSON.stringify(data)
        );


        alert(
            "✅ Data diri berhasil diperbarui!"
        );


        window.location.href =
            "dashboard.html";

    }
);


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}


</script>


</body>

</html>
