<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hasil Karya Excel</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.header {
    background: white;
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    margin-bottom: 20px;
}

.header .icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.header h1 {
    color: #333;
    margin-bottom: 8px;
}

.header p {
    color: #777;
}

.upload-box {
    background: white;
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.upload-box h2 {
    margin-bottom: 15px;
    color: #333;
}

input[type="file"] {
    width: 100%;
    padding: 15px;
    border: 2px dashed #667eea;
    border-radius: 12px;
    background: #f4f6fb;
}

input[type="text"] {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 11px;
    background: #667eea;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #5568d9;
}

.back {
    background: #333;
}

.karya {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.karya h3 {
    color: #333;
    margin-bottom: 8px;
}

.karya p {
    color: #777;
    font-size: 14px;
    margin-bottom: 12px;
}

.karya button {
    width: auto;
    display: inline-block;
    margin-right: 8px;
    padding: 10px 15px;
}

.hapus {
    background: #e74c3c;
}

.download {
    background: #2ecc71;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    color: #777;
}

.info {
    background: #f3f4ff;
    padding: 15px;
    border-radius: 12px;
    margin-top: 15px;
    color: #555;
    font-size: 13px;
    line-height: 1.5;
}

@media(max-width:600px) {

    body {
        padding: 15px;
    }

    .header,
    .upload-box {
        padding: 20px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon">
            📊
        </div>

        <h1>
            Hasil Karya Excel
        </h1>

        <p>
            Simpan dan kelola hasil karya Excel kamu
        </p>

    </div>


    <div class="upload-box">

        <h2>
            📁 Tambahkan Karya
        </h2>

        <input
            type="text"
            id="judul"
            placeholder="Judul karya, contoh: Tabel Nilai Siswa"
        >

        <input
            type="file"
            id="file"
            accept=".xls,.xlsx,.csv"
        >

        <button onclick="simpanKarya()">

            ➕ SIMPAN KARYA

        </button>


        <div class="info">

            💡 Format yang dapat dipilih:
            <b>.xls, .xlsx, dan .csv</b>.

            <br><br>

            File disimpan di browser perangkat ini.
            Jika cache/data browser dihapus, file dapat ikut terhapus.

        </div>

    </div>


    <div id="daftarKarya"></div>


    <button
        class="back"
        onclick="kembali()"
    >

        ← KEMBALI KE DASHBOARD

    </button>

</div>


<script>

/* LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/*
    File disimpan menggunakan IndexedDB.
    Ini lebih cocok untuk menyimpan file
    dibanding localStorage.
*/

let db;


const request =
    indexedDB.open(
        "DataDiriDB",
        1
    );


request.onupgradeneeded =
    function(event) {

        db =
            event.target.result;

        if (
            !db.objectStoreNames.contains(
                "karya"
            )
        ) {

            db.createObjectStore(
                "karya",
                {
                    keyPath: "id",
                    autoIncrement: true
                }
            );

        }

    };


request.onsuccess =
    function(event) {

        db =
            event.target.result;

        tampilkanKarya();

    };


request.onerror =
    function() {

        alert(
            "❌ Browser tidak dapat membuka penyimpanan file."
        );

    };


/* SIMPAN KARYA */

function simpanKarya() {

    const judul =
        document.getElementById(
            "judul"
        ).value.trim();

    const file =
        document.getElementById(
            "file"
        ).files[0];


    if (!judul) {

        alert(
            "⚠️ Masukkan judul karya."
        );

        return;

    }


    if (!file) {

        alert(
            "⚠️ Pilih file Excel terlebih dahulu."
        );

        return;

    }


    const karya = {

        judul: judul,

        namaFile:
            file.name,

        ukuran:
            file.size,

        tanggal:
            new Date().toLocaleString(
                "id-ID"
            ),

        file: file

    };


    const transaction =
        db.transaction(
            ["karya"],
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    store.add(karya);


    transaction.oncomplete =
        function() {

            alert(
                "✅ Karya berhasil disimpan!"
            );


            document.getElementById(
                "judul"
            ).value = "";


            document.getElementById(
                "file"
            ).value = "";


            tampilkanKarya();

        };

}


/* TAMPILKAN */

function tampilkanKarya() {

    const container =
        document.getElementById(
            "daftarKarya"
        );


    container.innerHTML = "";


    const transaction =
        db.transaction(
            ["karya"],
            "readonly"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    const request =
        store.getAll();


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                data.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        📂 Belum ada hasil karya.

                        <br><br>

                        Tambahkan file Excel
                        menggunakan tombol di atas.

                    </div>

                `;

                return;

            }


            data.reverse().forEach(
                function(item) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "karya";


                    div.innerHTML = `

                        <h3>
                            📊 ${escapeHTML(item.judul)}
                        </h3>

                        <p>
                            📁 ${escapeHTML(item.namaFile)}
                            <br>
                            🕒 ${escapeHTML(item.tanggal)}
                            <br>
                            💾 ${formatSize(item.ukuran)}
                        </p>

                        <button
                            class="download"
                            onclick="downloadKarya(${item.id})"
                        >
                            ⬇️ BUKA / DOWNLOAD
                        </button>

                        <button
                            class="hapus"
                            onclick="hapusKarya(${item.id})"
                        >
                            🗑️ HAPUS
                        </button>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );

        };

}


/* DOWNLOAD */

function downloadKarya(id) {

    const transaction =
        db.transaction(
            ["karya"],
            "readonly"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    const request =
        store.get(id);


    request.onsuccess =
        function() {

            const item =
                request.result;


            const url =
                URL.createObjectURL(
                    item.file
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href = url;

            a.download =
                item.namaFile;


            a.click();


            URL.revokeObjectURL(
                url
            );

        };

}


/* HAPUS */

function hapusKarya(id) {

    const yakin =
        confirm(
            "Hapus karya ini?"
        );


    if (!yakin) {

        return;

    }


    const transaction =
        db.transaction(
            ["karya"],
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    store.delete(id);


    transaction.oncomplete =
        function() {

            tampilkanKarya();

        };

}


/* FORMAT UKURAN */

function formatSize(bytes) {

    if (
        bytes < 1024
    ) {

        return bytes + " B";

    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(1) + " MB";

}


/* AMANKAN TEKS */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}

</script>

</body>

</html>
