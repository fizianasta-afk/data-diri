<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hasil Karya Excel</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 25px;

        }

        .container {

            width: 100%;
            max-width: 900px;

            margin: auto;

        }

        .header {

            background: white;

            padding: 30px;

            border-radius: 20px;

            text-align: center;

            margin-bottom: 20px;

        }

        .header .icon {

            font-size: 55px;

            margin-bottom: 10px;

        }

        .header h1 {

            color: #333;

            margin-bottom: 8px;

        }

        .header p {

            color: #777;

        }

        .form-box {

            background: white;

            padding: 25px;

            border-radius: 20px;

            margin-bottom: 25px;

        }

        .form-box h2 {

            margin-bottom: 20px;

            color: #333;

        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

        }

        input,
        textarea {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }

        textarea {

            min-height: 100px;

            resize: vertical;

        }

        input:focus,
        textarea:focus {

            border-color: #667eea;

        }

        .file {

            background: #f4f6fb;

            padding: 15px;

        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #5568d9;

        }

        .karya-list {

            display: grid;

            gap: 15px;

        }

        .karya {

            background: white;

            padding: 20px;

            border-radius: 18px;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.1);

        }

        .karya h3 {

            color: #333;

            margin-bottom: 8px;

        }

        .karya p {

            color: #777;

            margin-bottom: 10px;

        }

        .file-name {

            background: #f4f6fb;

            padding: 10px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 10px;

            word-break: break-all;

        }

        .hapus {

            background: #e74c3c;

        }

        .hapus:hover {

            background: #c0392b;

        }

        .kembali {

            background: #333;

            margin-top: 20px;

        }

        .kosong {

            background: white;

            padding: 30px;

            border-radius: 18px;

            text-align: center;

            color: #777;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="icon">
            📊
        </div>

        <h1>
            Hasil Karya Excel
        </h1>

        <p>
            Simpan dan tampilkan hasil karya Excel kamu
        </p>

    </div>


    <!-- FORM -->

    <div class="form-box">

        <h2>
            ➕ Tambah Hasil Karya
        </h2>


        <label>
            Nama Karya
        </label>

        <input
            type="text"
            id="namaKarya"
            placeholder="Contoh: Tabel Penjualan"
        >


        <label>
            Deskripsi
        </label>

        <textarea
            id="deskripsi"
            placeholder="Jelaskan hasil karya kamu..."
        ></textarea>


        <label>
            File Excel
        </label>

        <input
            type="file"
            id="fileExcel"
            class="file"
            accept=".xlsx,.xls,.csv"
        >


        <button onclick="tambahKarya()">

            📤 TAMBAH KARYA

        </button>

    </div>


    <!-- DAFTAR -->

    <div
        class="karya-list"
        id="karyaList"
    ></div>


    <!-- KEMBALI -->

    <button
        class="kembali"
        onclick="kembali()"
    >

        ← KEMBALI KE DASHBOARD

    </button>


</div>


<script>


/* CEK LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* TAMPILKAN KARYA */

function tampilkanKarya() {


    const daftar =
        JSON.parse(
            localStorage.getItem("karyaExcel")
        ) || [];


    const container =
        document.getElementById(
            "karyaList"
        );


    container.innerHTML = "";


    if (daftar.length === 0) {

        container.innerHTML = `

            <div class="kosong">

                📂 Belum ada hasil karya.

                <br><br>

                Tambahkan karya Excel pertama kamu!

            </div>

        `;

        return;

    }


    daftar.forEach(function(
        karya,
        index
    ) {


        const div =
            document.createElement(
                "div"
            );


        div.className = "karya";


        div.innerHTML = `

            <h3>
                📄 ${escapeHTML(karya.nama)}
            </h3>

            <p>
                ${escapeHTML(karya.deskripsi)}
            </p>

            <div class="file-name">

                📎 ${escapeHTML(karya.fileName)}

            </div>

            <button
                onclick="bukaFile(${index})"
            >

                📂 BUKA FILE

            </button>

            <button
                class="hapus"
                onclick="hapusKarya(${index})"
            >

                🗑️ HAPUS KARYA

            </button>

        `;


        container.appendChild(div);

    });

}


/* TAMBAH KARYA */

function tambahKarya() {


    const nama =
        document.getElementById(
            "namaKarya"
        ).value.trim();


    const deskripsi =
        document.getElementById(
            "deskripsi"
        ).value.trim();


    const file =
        document.getElementById(
            "fileExcel"
        ).files[0];


    if (!nama) {

        alert(
            "❌ Masukkan nama karya!"
        );

        return;

    }


    if (!file) {

        alert(
            "❌ Pilih file Excel terlebih dahulu!"
        );

        return;

    }


    /*
       Membaca file sebagai Data URL
    */

    const reader =
        new FileReader();


    reader.onload = function(e) {


        const daftar =
            JSON.parse(
                localStorage.getItem(
                    "karyaExcel"
                )
            ) || [];


        const karya = {

            nama: nama,

            deskripsi:
                deskripsi ||
                "Tidak ada deskripsi.",

            fileName:
                file.name,

            fileData:
                e.target.result

        };


        daftar.push(karya);


        try {

            localStorage.setItem(
                "karyaExcel",
                JSON.stringify(daftar)
            );


            alert(
                "✅ Hasil karya berhasil ditambahkan!"
            );


            document.getElementById(
                "namaKarya"
            ).value = "";


            document.getElementById(
                "deskripsi"
            ).value = "";


            document.getElementById(
                "fileExcel"
            ).value = "";


            tampilkanKarya();


        } catch(error) {

            alert(
                "❌ File terlalu besar untuk penyimpanan browser."
                + "\n\nGunakan file Excel yang lebih kecil."
            );

        }

    };


    reader.readAsDataURL(file);

}


/* BUKA FILE */

function bukaFile(index) {


    const daftar =
        JSON.parse(
            localStorage.getItem(
                "karyaExcel"
            )
        ) || [];


    const karya =
        daftar[index];


    if (!karya) {

        alert(
            "❌ File tidak ditemukan."
        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        karya.fileData;


    link.download =
        karya.fileName;


    link.click();

}


/* HAPUS */

function hapusKarya(index) {


    const yakin =
        confirm(
            "Yakin ingin menghapus karya ini?"
        );


    if (!yakin) {

        return;

    }


    const daftar =
        JSON.parse(
            localStorage.getItem(
                "karyaExcel"
            )
        ) || [];


    daftar.splice(
        index,
        1
    );


    localStorage.setItem(
        "karyaExcel",
        JSON.stringify(daftar)
    );


    tampilkanKarya();

}


/* KEAMANAN TEKS */

function escapeHTML(teks) {

    return teks
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}


/* MULAI */

tampilkanKarya();


</script>


</body>

</html>
