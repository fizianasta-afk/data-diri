<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jadwal Pelajaran</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 20px;

}

.container {

    width: 100%;

    max-width: 1000px;

    margin: auto;

}

.box {

    background: white;

    padding: 25px;

    border-radius: 22px;

    margin-bottom: 20px;

    box-shadow:
        0 15px 40px rgba(
            0,
            0,
            0,
            0.15
        );

}

.header {

    text-align: center;

}

.icon {

    font-size: 55px;

    margin-bottom: 10px;

}

.header h1 {

    color: #333;

    margin-bottom: 7px;

}

.header p {

    color: #777;

}

.pin {

    max-width: 450px;

    margin: 60px auto;

    text-align: center;

}

.pin input {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 22px;

    text-align: center;

    letter-spacing: 5px;

}

button {

    width: 100%;

    padding: 13px;

    margin-top: 12px;

    border: none;

    border-radius: 10px;

    background: #667eea;

    color: white;

    font-weight: bold;

    cursor: pointer;

}

.back {

    background: #333;

}

.hidden {

    display: none;

}

.day {

    margin-bottom: 25px;

}

.day-title {

    background: #667eea;

    color: white;

    padding: 14px;

    border-radius: 12px 12px 0 0;

    font-size: 18px;

    font-weight: bold;

}

.table-wrap {

    overflow-x: auto;

}

table {

    width: 100%;

    border-collapse: collapse;

    background: white;

}

th {

    background: #f0f2ff;

    color: #555;

    padding: 13px;

    text-align: left;

}

td {

    padding: 13px;

    border-top: 1px solid #eee;

}

.waktu {

    white-space: nowrap;

    color: #667eea;

    font-weight: bold;

}

.nama {

    font-weight: bold;

    color: #333;

}

.guru {

    color: #777;

    font-size: 13px;

}

.istirahat {

    background: #fff8e1;

}

.kegiatan {

    background: #f3e5f5;

}

.empty {

    padding: 40px;

    text-align: center;

    background: #f6f7fb;

    border-radius: 15px;

    color: #777;

}

.info {

    background: #f0f2ff;

    padding: 15px;

    border-radius: 12px;

    color: #555;

    font-size: 13px;

    margin-bottom: 20px;

}

@media(max-width:600px) {

    body {

        padding: 12px;

    }

    .box {

        padding: 18px;

    }

    th,
    td {

        padding: 10px;

        font-size: 13px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- PIN -->

<div
    id="pinPage"
    class="box pin"
>

    <div class="icon">
        🔐
    </div>

    <h1>
        Jadwal Pelajaran
    </h1>

    <p>
        Masukkan PIN Jadwal
    </p>


    <input
        type="password"
        id="pin"
        maxlength="6"
        inputmode="numeric"
        placeholder="PIN"
    >


    <button
        onclick="cekPIN()"
    >

        🔓 MASUK JADWAL

    </button>


    <button
        class="back"
        onclick="dashboard()"
    >

        ← KEMBALI

    </button>

</div>


<!-- JADWAL -->

<div
    id="jadwalPage"
    class="hidden"
>


<div class="box header">

    <div class="icon">
        📅
    </div>

    <h1>
        Jadwal Pelajaran
    </h1>

    <p id="sekolah">
        Jadwal Sekolah
    </p>

</div>


<div class="box">


<div class="info">

📚 Jadwal ini dibuat dan diatur sendiri
oleh pengguna.

</div>


<div id="jadwalContainer">

</div>


<button
    class="back"
    onclick="dashboard()"
>

← KEMBALI KE DASHBOARD

</button>


</div>


</div>


</div>


<script>


/* LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    location.href =
        "login.html";

}


const user =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (!user) {

    location.href =
        "login.html";

}


/* =========================
   PIN
========================= */

function cekPIN() {

    const pin =
        document.getElementById(
            "pin"
        ).value;


    if (
        pin !== user.pinJadwal
    ) {

        alert(
            "❌ PIN Jadwal salah!"
        );

        return;

    }


    document.getElementById(
        "pinPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "jadwalPage"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "sekolah"
    ).textContent =
        user.sekolah ||
        "Jadwal Sekolah";


    tampilkanJadwal();

}


/* =========================
   TAMPIL
========================= */

function tampilkanJadwal() {

    const container =
        document.getElementById(
            "jadwalContainer"
        );


    container.innerHTML = "";


    const jadwal =
        JSON.parse(
            localStorage.getItem(
                "jadwal"
            )
        ) || [];


    if (
        jadwal.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                📭

                <br><br>

                Belum ada jadwal.

                <br><br>

                Silakan buka
                <b>Edit Jadwal</b>
                untuk membuat jadwal.

            </div>

        `;

        return;

    }


    const hariList = [

        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat",
        "Sabtu"

    ];


    hariList.forEach(
        hari => {

            const data =
                jadwal
                .filter(
                    item =>
                        item.hari === hari
                )
                .sort(
                    (a, b) =>
                        a.mulai.localeCompare(
                            b.mulai
                        )
                );


            if (
                data.length === 0
            ) {

                return;

            }


            const day =
                document.createElement(
                    "div"
                );


            day.className =
                "day";


            day.innerHTML = `

                <div class="day-title">

                    📅 ${hari}

                </div>


                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Jam
                                </th>

                                <th>
                                    Kegiatan
                                </th>

                                <th>
                                    Guru / Keterangan
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                        </tbody>

                    </table>

                </div>

            `;


            const tbody =
                day.querySelector(
                    "tbody"
                );


            data.forEach(
                item => {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    if (
                        item.jenis ===
                        "istirahat"
                    ) {

                        tr.className =
                            "istirahat";

                    }


                    if (
                        item.jenis ===
                        "kegiatan"
                    ) {

                        tr.className =
                            "kegiatan";

                    }


                    let icon =
                        "📚";


                    if (
                        item.jenis ===
                        "istirahat"
                    ) {

                        icon =
                            "☕";

                    }


                    if (
                        item.jenis ===
                        "kegiatan"
                    ) {

                        icon =
                            "🎯";

                    }


                    tr.innerHTML = `

                        <td class="waktu">

                            ${escapeHTML(
                                item.mulai
                            )}

                            -

                            ${escapeHTML(
                                item.selesai
                            )}

                        </td>


                        <td class="nama">

                            ${icon}

                            ${escapeHTML(
                                item.nama
                            )}

                        </td>


                        <td class="guru">

                            ${
                                item.guru
                                ? escapeHTML(
                                    item.guru
                                )
                                : "-"
                            }

                        </td>

                    `;


                    tbody.appendChild(
                        tr
                    );

                }
            );


            container.appendChild(
                day
            );

        }
    );

}


/* =========================
   KEAMANAN HTML
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   DASHBOARD
========================= */

function dashboard() {

    location.href =
        "dashboard.html";

}

</script>


</body>

</html>
