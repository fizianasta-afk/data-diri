<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Jadwal Pelajaran</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 20px;

}

.container {

    width: 100%;

    max-width: 850px;

    margin: auto;

}

.box {

    background: white;

    padding: 25px;

    border-radius: 22px;

    box-shadow:
        0 15px 40px rgba(
            0,
            0,
            0,
            0.18
        );

    margin-bottom: 20px;

}

.header {

    text-align: center;

}

.header .icon {

    font-size: 55px;

    margin-bottom: 10px;

}

.header h1 {

    color: #333;

    margin-bottom: 7px;

}

.header p {

    color: #777;

}

.pin-box {

    max-width: 450px;

    margin: 50px auto;

    text-align: center;

}

.pin-box input {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    text-align: center;

    font-size: 22px;

    letter-spacing: 5px;

}

button {

    width: 100%;

    padding: 13px;

    margin-top: 12px;

    border: none;

    border-radius: 10px;

    color: white;

    background: #667eea;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #5568d9;

}

.tambah {

    background: #2ecc71;

}

.hapus-semua {

    background: #e74c3c;

}

.back {

    background: #333;

}

.form-jadwal {

    background: #f6f7fb;

    padding: 18px;

    border-radius: 15px;

    margin-top: 15px;

}

.form-jadwal h3 {

    color: #667eea;

    margin-bottom: 12px;

}

label {

    display: block;

    font-weight: bold;

    color: #444;

    margin-top: 10px;

    margin-bottom: 6px;

}

input,
select {

    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 9px;

    outline: none;

    background: white;

}

.jam {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

}

.pelajaran {

    position: relative;

}

.hapus {

    background: #e74c3c;

}

.info {

    background: #f0f2ff;

    padding: 14px;

    border-radius: 10px;

    margin-top: 15px;

    color: #555;

    font-size: 13px;

    line-height: 1.5;

}

.hidden {

    display: none;

}

@media(max-width:600px) {

    body {

        padding: 12px;

    }

    .box {

        padding: 18px;

    }

    .jam {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- PIN -->

<div
    id="pinPage"
    class="box pin-box"
>

    <div class="header">

        <div class="icon">
            🔐
        </div>

        <h1>
            Edit Jadwal
        </h1>

        <p>
            Masukkan PIN Edit Jadwal
        </p>

    </div>


    <input
        type="password"
        id="pin"
        maxlength="6"
        inputmode="numeric"
        placeholder="Masukkan PIN"
    >


    <button onclick="cekPIN()">

        🔓 BUKA EDIT JADWAL

    </button>


    <button
        class="back"
        onclick="kembaliDashboard()"
    >

        ← KEMBALI

    </button>

</div>


<!-- EDIT -->

<div
    id="editPage"
    class="hidden"
>


<div class="box header">

    <div class="icon">
        ✏️
    </div>

    <h1>
        Edit Jadwal Pelajaran
    </h1>

    <p>
        Atur jadwal pelajaran kamu sendiri
    </p>

</div>


<div class="box">


<div class="info">

💡 Kamu bisa menambahkan pelajaran
sebanyak yang kamu inginkan.

<br><br>

Setelah selesai, tekan
<b>Simpan Semua Jadwal</b>.

</div>


<div id="daftarForm">

</div>


<button
    class="tambah"
    onclick="tambahPelajaran()"
>

➕ TAMBAH PELAJARAN

</button>


<button
    onclick="simpanSemua()"
>

💾 SIMPAN SEMUA JADWAL

</button>


<button
    class="hapus-semua"
    onclick="hapusSemua()"
>

🗑️ HAPUS SEMUA JADWAL

</button>


<button
    class="back"
    onclick="kembaliDashboard()"
>

← KEMBALI KE DASHBOARD

</button>


</div>


</div>


</div>


<script>


/* =========================
   CEK LOGIN
========================= */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* =========================
   DATA
========================= */

const data =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (!data) {

    window.location.href =
        "login.html";

}


/* =========================
   CEK PIN
========================= */

function cekPIN() {

    const pin =
        document.getElementById(
            "pin"
        ).value;


    if (
        pin !== data.pinEdit
    ) {

        alert(
            "❌ PIN Edit Jadwal salah!"
        );

        return;

    }


    document.getElementById(
        "pinPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "editPage"
    ).classList.remove(
        "hidden"
    );


    tampilkanForm();

}


/* =========================
   AMBIL JADWAL
========================= */

function ambilJadwal() {

    return JSON.parse(
        localStorage.getItem(
            "jadwal"
        )
    ) || [];

}


/* =========================
   TAMPIL FORM
========================= */

function tampilkanForm() {

    const daftar =
        document.getElementById(
            "daftarForm"
        );


    daftar.innerHTML = "";


    const jadwal =
        ambilJadwal();


    if (
        jadwal.length === 0
    ) {

        tambahPelajaran();

        return;

    }


    jadwal.forEach(
        function(item, index) {

            buatForm(
                item,
                index
            );

        }
    );

}


/* =========================
   BUAT FORM
========================= */

function buatForm(
    item = {},
    index = null
) {

    const daftar =
        document.getElementById(
            "daftarForm"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "form-jadwal pelajaran";


    div.innerHTML = `

        <h3>
            📚 Pelajaran
        </h3>

        <label>
            Hari
        </label>

        <select class="hari">

            <option value="">
                Pilih Hari
            </option>

            <option value="Senin">
                Senin
            </option>

            <option value="Selasa">
                Selasa
            </option>

            <option value="Rabu">
                Rabu
            </option>

            <option value="Kamis">
                Kamis
            </option>

            <option value="Jumat">
                Jumat
            </option>

            <option value="Sabtu">
                Sabtu
            </option>

        </select>


        <label>
            Mata Pelajaran
        </label>

        <input
            type="text"
            class="mapel"
            placeholder="Contoh: Matematika"
        >


        <label>
            Guru
        </label>

        <input
            type="text"
            class="guru"
            placeholder="Contoh: Pak Budi"
        >


        <label>
            Jam Pelajaran
        </label>

        <div class="jam">

            <input
                type="time"
                class="mulai"
            >

            <input
                type="time"
                class="selesai"
            >

        </div>


        <button
            class="hapus"
            onclick="hapusForm(this)"
        >

            🗑️ Hapus Pelajaran

        </button>

    `;


    daftar.appendChild(
        div
    );


    div.querySelector(
        ".hari"
    ).value =
        item.hari || "";


    div.querySelector(
        ".mapel"
    ).value =
        item.mapel || "";


    div.querySelector(
        ".guru"
    ).value =
        item.guru || "";


    div.querySelector(
        ".mulai"
    ).value =
        item.mulai || "";


    div.querySelector(
        ".selesai"
    ).value =
        item.selesai || "";

}


/* =========================
   TAMBAH
========================= */

function tambahPelajaran() {

    buatForm();

}


/* =========================
   HAPUS FORM
========================= */

function hapusForm(button) {

    const form =
        button.closest(
            ".pelajaran"
        );


    form.remove();

}


/* =========================
   SIMPAN
========================= */

function simpanSemua() {

    const forms =
        document.querySelectorAll(
            ".pelajaran"
        );


    const jadwal = [];


    forms.forEach(
        function(form) {

            const hari =
                form.querySelector(
                    ".hari"
                ).value;


            const mapel =
                form.querySelector(
                    ".mapel"
                ).value.trim();


            const guru =
                form.querySelector(
                    ".guru"
                ).value.trim();


            const mulai =
                form.querySelector(
                    ".mulai"
                ).value;


            const selesai =
                form.querySelector(
                    ".selesai"
                ).value;


            if (
                !hari &&
                !mapel &&
                !guru &&
                !mulai &&
                !selesai
            ) {

                return;

            }


            if (
                !hari ||
                !mapel ||
                !mulai ||
                !selesai
            ) {

                return;

            }


            jadwal.push({

                hari:
                    hari,

                mapel:
                    mapel,

                guru:
                    guru,

                mulai:
                    mulai,

                selesai:
                    selesai

            });

        }
    );


    if (
        jadwal.length === 0
    ) {

        alert(
            "⚠️ Belum ada jadwal yang diisi."
        );

        return;

    }


    localStorage.setItem(
        "jadwal",
        JSON.stringify(
            jadwal
        )
    );


    alert(
        "✅ Semua jadwal berhasil disimpan!"
    );


}


/* =========================
   HAPUS SEMUA
========================= */

function hapusSemua() {

    const yakin =
        confirm(
            "Hapus semua jadwal?"
        );


    if (!yakin) {

        return;

    }


    localStorage.removeItem(
        "jadwal"
    );


    document.getElementById(
        "daftarForm"
    ).innerHTML = "";


    alert(
        "✅ Semua jadwal telah dihapus."
    );


}


/* =========================
   KEMBALI
========================= */

function kembaliDashboard() {

    window.location.href =
        "dashboard.html";

}

</script>


</body>

</html>
