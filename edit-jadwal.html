<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Jadwal Sekolah</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 20px;

}

.container {

    max-width: 1000px;

    width: 100%;

    margin: auto;

}

.box {

    background: white;

    border-radius: 22px;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow:
        0 15px 40px rgba(
            0,
            0,
            0,
            0.15
        );

}

.header {

    text-align: center;

}

.header-icon {

    font-size: 55px;

    margin-bottom: 10px;

}

.header h1 {

    color: #333;

    margin-bottom: 7px;

}

.header p {

    color: #777;

}

.pin {

    max-width: 450px;

    margin: 60px auto;

    text-align: center;

}

.pin input {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 22px;

    text-align: center;

    letter-spacing: 5px;

}

button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    margin-top: 12px;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    background: #667eea;

}

button:hover {

    opacity: 0.9;

}

.add {

    background: #2ecc71;

}

.save {

    background: #3498db;

}

.delete {

    background: #e74c3c;

}

.back {

    background: #333;

}

.form {

    background: #f6f7fb;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    border-left: 5px solid #667eea;

}

.form h3 {

    color: #667eea;

    margin-bottom: 15px;

}

label {

    display: block;

    font-weight: bold;

    color: #444;

    margin-top: 10px;

    margin-bottom: 6px;

}

input,
select {

    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 9px;

    background: white;

}

.grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

}

.jam {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

}

.info {

    background: #f0f2ff;

    padding: 15px;

    border-radius: 12px;

    color: #555;

    font-size: 13px;

    line-height: 1.6;

}

.hidden {

    display: none;

}

@media(max-width:650px) {

    body {

        padding: 12px;

    }

    .box {

        padding: 18px;

    }

    .grid {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     PIN
========================= -->

<div
    id="pinPage"
    class="box pin"
>

    <div class="header-icon">
        🔐
    </div>

    <h1>
        Edit Jadwal
    </h1>

    <p>
        Masukkan PIN Edit Jadwal
    </p>


    <input
        type="password"
        id="pin"
        maxlength="6"
        inputmode="numeric"
        placeholder="PIN"
    >


    <button
        onclick="cekPIN()"
    >

        🔓 BUKA EDIT JADWAL

    </button>


    <button
        class="back"
        onclick="dashboard()"
    >

        ← KEMBALI

    </button>

</div>


<!-- =========================
     EDIT PAGE
========================= -->

<div
    id="editPage"
    class="hidden"
>


<div class="box header">

    <div class="header-icon">
        ✏️
    </div>

    <h1>
        Edit Jadwal Sekolah
    </h1>

    <p>
        Atur jadwal sesuai jadwal sekolah kamu
    </p>

</div>


<div class="box">


<div class="info">

💡 <b>Jenis kegiatan:</b>

<br>

📚 Pelajaran — mata pelajaran biasa

<br>

☕ Istirahat — waktu istirahat

<br>

🎯 Kegiatan — upacara, olahraga,
ekstrakurikuler, dll.

</div>


<div id="listForm"></div>


<button
    class="add"
    onclick="tambah()"
>

➕ TAMBAH JAM

</button>


<button
    class="save"
    onclick="simpan()"
>

💾 SIMPAN JADWAL

</button>


<button
    class="delete"
    onclick="hapusSemua()"
>

🗑️ HAPUS SEMUA JADWAL

</button>


<button
    class="back"
    onclick="dashboard()"
>

← KEMBALI KE DASHBOARD

</button>


</div>


</div>


</div>


<script>


/* =========================
   LOGIN
========================= */

if (
    localStorage.getItem("login")
    !== "true"
) {

    location.href =
        "login.html";

}


const user =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (!user) {

    location.href =
        "login.html";

}


/* =========================
   PIN
========================= */

function cekPIN() {

    const pin =
        document.getElementById(
            "pin"
        ).value;


    if (
        pin !== user.pinEdit
    ) {

        alert(
            "❌ PIN Edit Jadwal salah!"
        );

        return;

    }


    document.getElementById(
        "pinPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "editPage"
    ).classList.remove(
        "hidden"
    );


    tampilkanForm();

}


/* =========================
   DATA
========================= */

function getJadwal() {

    return JSON.parse(
        localStorage.getItem(
            "jadwal"
        )
    ) || [];

}


/* =========================
   TAMPIL
========================= */

function tampilkanForm() {

    const container =
        document.getElementById(
            "listForm"
        );


    container.innerHTML = "";


    const data =
        getJadwal();


    if (
        data.length === 0
    ) {

        tambah();

        return;

    }


    data.forEach(
        item =>
            buatForm(item)
    );

}


/* =========================
   BUAT FORM
========================= */

function buatForm(item = {}) {

    const container =
        document.getElementById(
            "listForm"
        );


    const form =
        document.createElement(
            "div"
        );


    form.className =
        "form";


    form.innerHTML = `

        <h3>
            ⏰ Jam Jadwal
        </h3>


        <div class="grid">


            <div>

                <label>
                    Hari
                </label>

                <select class="hari">

                    <option value="">
                        Pilih Hari
                    </option>

                    <option>
                        Senin
                    </option>

                    <option>
                        Selasa
                    </option>

                    <option>
                        Rabu
                    </option>

                    <option>
                        Kamis
                    </option>

                    <option>
                        Jumat
                    </option>

                    <option>
                        Sabtu
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Jenis
                </label>

                <select class="jenis">

                    <option value="pelajaran">
                        📚 Pelajaran
                    </option>

                    <option value="istirahat">
                        ☕ Istirahat
                    </option>

                    <option value="kegiatan">
                        🎯 Kegiatan
                    </option>

                </select>

            </div>


        </div>


        <label>
            Nama
        </label>

        <input
            class="nama"
            type="text"
            placeholder="Contoh: Matematika"
        >


        <label>
            Guru / Keterangan
        </label>

        <input
            class="guru"
            type="text"
            placeholder="Contoh: Pak Budi"
        >


        <label>
            Jam
        </label>

        <div class="jam">

            <input
                class="mulai"
                type="time"
            >

            <input
                class="selesai"
                type="time"
            >

        </div>


        <button
            class="delete"
            onclick="hapusForm(this)"
        >

            🗑️ HAPUS JAM INI

        </button>

    `;


    container.appendChild(
        form
    );


    form.querySelector(
        ".hari"
    ).value =
        item.hari || "";


    form.querySelector(
        ".jenis"
    ).value =
        item.jenis ||
        "pelajaran";


    form.querySelector(
        ".nama"
    ).value =
        item.nama ||
        item.mapel ||
        "";


    form.querySelector(
        ".guru"
    ).value =
        item.guru ||
        "";


    form.querySelector(
        ".mulai"
    ).value =
        item.mulai ||
        "";


    form.querySelector(
        ".selesai"
    ).value =
        item.selesai ||
        "";

}


/* =========================
   TAMBAH
========================= */

function tambah() {

    buatForm();

}


/* =========================
   HAPUS SATU
========================= */

function hapusForm(button) {

    const form =
        button.closest(
            ".form"
        );


    form.remove();

}


/* =========================
   SIMPAN
========================= */

function simpan() {

    const forms =
        document.querySelectorAll(
            ".form"
        );


    const jadwal = [];


    forms.forEach(
        form => {

            const hari =
                form.querySelector(
                    ".hari"
                ).value;


            const jenis =
                form.querySelector(
                    ".jenis"
                ).value;


            const nama =
                form.querySelector(
                    ".nama"
                ).value.trim();


            const guru =
                form.querySelector(
                    ".guru"
                ).value.trim();


            const mulai =
                form.querySelector(
                    ".mulai"
                ).value;


            const selesai =
                form.querySelector(
                    ".selesai"
                ).value;


            if (
                !hari &&
                !nama &&
                !mulai &&
                !selesai
            ) {

                return;

            }


            if (
                !hari ||
                !nama ||
                !mulai ||
                !selesai
            ) {

                return;

            }


            jadwal.push({

                hari:
                    hari,

                jenis:
                    jenis,

                nama:
                    nama,

                guru:
                    guru,

                mulai:
                    mulai,

                selesai:
                    selesai

            });

        }
    );


    if (
        jadwal.length === 0
    ) {

        alert(
            "⚠️ Belum ada jadwal."
        );

        return;

    }


    localStorage.setItem(
        "jadwal",
        JSON.stringify(
            jadwal
        )
    );


    alert(
        "✅ Jadwal berhasil disimpan!"
    );

}


/* =========================
   HAPUS SEMUA
========================= */

function hapusSemua() {

    if (
        !confirm(
            "Hapus semua jadwal?"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        "jadwal"
    );


    document.getElementById(
        "listForm"
    ).innerHTML = "";


    tambah();


    alert(
        "🗑️ Semua jadwal telah dihapus."
    );

}


/* =========================
   DASHBOARD
========================= */

function dashboard() {

    location.href =
        "dashboard.html";

}

</script>


</body>

</html>
