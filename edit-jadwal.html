<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Jadwal Pelajaran</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    padding: 25px;

}

.container {

    width: 100%;

    max-width: 900px;

    margin: auto;

}

/* PIN */

.pin-box {

    background: white;

    padding: 35px;

    border-radius: 22px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(
            0,
            0,
            0,
            0.2
        );

}

.pin-icon {

    font-size: 60px;

    margin-bottom: 15px;

}

.pin-box h1 {

    color: #333;

    margin-bottom: 8px;

}

.pin-box p {

    color: #777;

    margin-bottom: 25px;

}

.pin-input {

    width: 100%;

    padding: 15px;

    border: 2px solid #ddd;

    border-radius: 12px;

    text-align: center;

    font-size: 22px;

    letter-spacing: 8px;

    outline: none;

}

.pin-input:focus {

    border-color: #667eea;

}

/* BUTTON */

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 11px;

    background: #667eea;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #5568d9;

}

.back {

    background: #333;

}

.add {

    background: #2ecc71;

}

.delete {

    width: auto;

    margin: 0;

    padding: 10px 14px;

    background: #e74c3c;

}

/* EDIT PAGE */

#editPage {

    display: none;

}

.header {

    background: white;

    padding: 30px;

    border-radius: 22px;

    text-align: center;

    margin-bottom: 20px;

}

.header h1 {

    color: #333;

    margin-bottom: 8px;

}

.header p {

    color: #777;

}

/* HARI */

.day {

    background: white;

    padding: 20px;

    border-radius: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 10px 25px rgba(
            0,
            0,
            0,
            0.08
        );

}

.day h2 {

    color: #667eea;

    margin-bottom: 15px;

}

/* JADWAL */

.schedule {

    display: grid;

    grid-template-columns:
        1fr
        1fr
        2fr
        auto;

    gap: 10px;

    margin-bottom: 10px;

}

.schedule input {

    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 10px;

    outline: none;

}

.schedule input:focus {

    border-color: #667eea;

}

.save {

    background: #667eea;

    margin-top: 5px;

}

.message {

    text-align: center;

    color: white;

    font-weight: bold;

    margin-top: 15px;

}

@media(max-width:650px) {

    .schedule {

        grid-template-columns: 1fr;

    }

    .delete {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- PIN -->

<div
    class="pin-box"
    id="pinPage"
>

    <div class="pin-icon">
        🔐
    </div>

    <h1>
        Edit Jadwal Pelajaran
    </h1>

    <p>
        Masukkan PIN Edit Jadwal
    </p>

    <input
        type="password"
        id="pin"
        class="pin-input"
        maxlength="6"
        inputmode="numeric"
        placeholder="••••"
    >

    <button onclick="cekPIN()">
        🔓 BUKA EDIT JADWAL
    </button>

    <button
        class="back"
        onclick="kembali()"
    >
        ← KEMBALI
    </button>

</div>


<!-- EDIT -->

<div
    id="editPage"
>

    <div class="header">

        <h1>
            ✏️ Edit Jadwal
        </h1>

        <p>
            Atur jam dan mata pelajaran kamu
        </p>

    </div>


    <div id="jadwalForm"></div>


    <button
        class="save"
        onclick="simpanJadwal()"
    >

        💾 SIMPAN JADWAL

    </button>


    <button
        class="back"
        onclick="kembali()"
    >

        ← KEMBALI KE DASHBOARD

    </button>


    <div
        id="message"
        class="message"
    ></div>

</div>


</div>


<script>


/* CEK LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* HARI */

const hari = [

    "Senin",
    "Selasa",
    "Rabu",
    "Kamis",
    "Jumat"

];


/* CEK PIN */

function cekPIN() {

    const pin =
        document.getElementById(
            "pin"
        ).value;


    const data =
        JSON.parse(
            localStorage.getItem(
                "dataDiri"
            )
        );


    if (!data) {

        alert(
            "❌ Data akun tidak ditemukan."
        );

        return;

    }


    if (pin === data.pinEdit) {

        document.getElementById(
            "pinPage"
        ).style.display =
            "none";


        document.getElementById(
            "editPage"
        ).style.display =
            "block";


        buatForm();

    }

    else {

        alert(
            "❌ PIN Edit Jadwal salah!"
        );

        document.getElementById(
            "pin"
        ).value = "";

    }

}


/* BUAT FORM */

function buatForm() {

    const container =
        document.getElementById(
            "jadwalForm"
        );


    container.innerHTML = "";


    const data =
        JSON.parse(
            localStorage.getItem(
                "jadwalBaru"
            )
        ) || {};


    hari.forEach(
        function(namaHari) {


            const day =
                document.createElement(
                    "div"
                );


            day.className =
                "day";


            day.dataset.hari =
                namaHari;


            const title =
                document.createElement(
                    "h2"
                );


            title.textContent =
                "📚 " + namaHari;


            day.appendChild(
                title
            );


            const daftar =
                data[namaHari] || [];


            if (
                daftar.length > 0
            ) {

                daftar.forEach(
                    function(item) {

                        tambahBaris(
                            day,
                            item.mulai,
                            item.selesai,
                            item.pelajaran
                        );

                    }
                );

            }


            const tambah =
                document.createElement(
                    "button"
                );


            tambah.className =
                "add";


            tambah.textContent =
                "➕ Tambah Pelajaran";


            tambah.onclick =
                function() {

                    tambahBaris(
                        day,
                        "",
                        "",
                        ""
                    );

                };


            day.appendChild(
                tambah
            );


            container.appendChild(
                day
            );

        }
    );

}


/* TAMBAH BARIS */

function tambahBaris(
    container,
    mulai,
    selesai,
    pelajaran
) {


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "schedule";


    const inputMulai =
        document.createElement(
            "input"
        );


    inputMulai.type =
        "time";


    inputMulai.value =
        mulai || "";


    const inputSelesai =
        document.createElement(
            "input"
        );


    inputSelesai.type =
        "time";


    inputSelesai.value =
        selesai || "";


    const inputPelajaran =
        document.createElement(
            "input"
        );


    inputPelajaran.type =
        "text";


    inputPelajaran.placeholder =
        "Mata pelajaran";


    inputPelajaran.value =
        pelajaran || "";


    const hapus =
        document.createElement(
            "button"
        );


    hapus.className =
        "delete";


    hapus.textContent =
        "🗑️";


    hapus.onclick =
        function() {

            row.remove();

        };


    row.appendChild(
        inputMulai
    );


    row.appendChild(
        inputSelesai
    );


    row.appendChild(
        inputPelajaran
    );


    row.appendChild(
        hapus
    );


    container.insertBefore(
        row,
        container.querySelector(
            ".add"
        )
    );

}


/* SIMPAN */

function simpanJadwal() {


    const hasil = {};


    const days =
        document.querySelectorAll(
            ".day"
        );


    days.forEach(
        function(day) {


            const namaHari =
                day.dataset.hari;


            hasil[namaHari] =
                [];


            const rows =
                day.querySelectorAll(
                    ".schedule"
                );


            rows.forEach(
                function(row) {


                    const inputs =
                        row.querySelectorAll(
                            "input"
                        );


                    const mulai =
                        inputs[0].value;


                    const selesai =
                        inputs[1].value;


                    const pelajaran =
                        inputs[2].value.trim();


                    if (
                        mulai &&
                        selesai &&
                        pelajaran
                    ) {

                        hasil[
                            namaHari
                        ].push({

                            mulai:
                                mulai,

                            selesai:
                                selesai,

                            pelajaran:
                                pelajaran

                        });

                    }

                }
            );

        }
    );


    localStorage.setItem(
        "jadwalBaru",
        JSON.stringify(hasil)
    );


    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "✅ Jadwal berhasil disimpan!";


    setTimeout(
        function() {

            message.textContent =
                "";

        },
        2500
    );

}


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}

</script>

</body>

</html>
