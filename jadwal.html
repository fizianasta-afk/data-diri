<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jadwal Pelajaran</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    padding: 25px;

}

.container {

    width: 100%;

    max-width: 900px;

    margin: auto;

}


/* PIN */

.pin-box {

    background: white;

    padding: 35px;

    border-radius: 22px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(
            0,
            0,
            0,
            0.2
        );

}

.pin-icon {

    font-size: 60px;

    margin-bottom: 15px;

}

.pin-box h1 {

    color: #333;

    margin-bottom: 8px;

}

.pin-box p {

    color: #777;

    margin-bottom: 25px;

}

.pin-input {

    width: 100%;

    padding: 15px;

    border: 2px solid #ddd;

    border-radius: 12px;

    text-align: center;

    font-size: 22px;

    letter-spacing: 8px;

    outline: none;

}

.pin-input:focus {

    border-color: #667eea;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 11px;

    background: #667eea;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #5568d9;

}

.back {

    background: #333;

}


/* JADWAL */

#jadwalPage {

    display: none;

}

.header {

    background: white;

    padding: 30px;

    border-radius: 22px;

    text-align: center;

    margin-bottom: 20px;

}

.header h1 {

    color: #333;

    margin-bottom: 8px;

}

.header p {

    color: #777;

}

.day {

    background: white;

    padding: 20px;

    border-radius: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 10px 25px rgba(
            0,
            0,
            0,
            0.08
        );

}

.day h2 {

    color: #667eea;

    margin-bottom: 15px;

}

.lesson {

    display: grid;

    grid-template-columns:
        130px
        1fr;

    gap: 15px;

    padding: 14px;

    background: #f4f6fb;

    border-radius: 12px;

    margin-bottom: 10px;

}

.time {

    font-weight: bold;

    color: #667eea;

}

.subject {

    color: #333;

    font-weight: bold;

}

.empty {

    color: #888;

    text-align: center;

    padding: 10px;

}

@media(max-width:600px) {

    .lesson {

        grid-template-columns: 1fr;

        gap: 5px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- PIN -->

<div
    class="pin-box"
    id="pinPage"
>

    <div class="pin-icon">
        🔐
    </div>

    <h1>
        Jadwal Pelajaran
    </h1>

    <p>
        Masukkan PIN untuk melihat jadwal
    </p>

    <input
        type="password"
        id="pin"
        class="pin-input"
        maxlength="6"
        inputmode="numeric"
        placeholder="••••"
    >

    <button onclick="cekPIN()">

        🔓 BUKA JADWAL

    </button>

    <button
        class="back"
        onclick="kembali()"
    >

        ← KEMBALI

    </button>

</div>


<!-- JADWAL -->

<div
    id="jadwalPage"
>

    <div class="header">

        <h1>
            📅 Jadwal Pelajaran
        </h1>

        <p>
            Jadwal sekolah kamu
        </p>

    </div>


    <div id="jadwalList"></div>


    <button
        class="back"
        onclick="kembali()"
    >

        ← KEMBALI KE DASHBOARD

    </button>

</div>


</div>


<script>


/* LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* HARI */

const hari = [

    "Senin",
    "Selasa",
    "Rabu",
    "Kamis",
    "Jumat"

];


/* PIN */

function cekPIN() {


    const pin =
        document.getElementById(
            "pin"
        ).value;


    const data =
        JSON.parse(
            localStorage.getItem(
                "dataDiri"
            )
        );


    if (
        data &&
        pin === data.pinJadwal
    ) {


        document.getElementById(
            "pinPage"
        ).style.display =
            "none";


        document.getElementById(
            "jadwalPage"
        ).style.display =
            "block";


        tampilkanJadwal();


    }

    else {

        alert(
            "❌ PIN Jadwal salah!"
        );

        document.getElementById(
            "pin"
        ).value = "";

    }

}


/* TAMPILKAN */

function tampilkanJadwal() {


    const data =
        JSON.parse(
            localStorage.getItem(
                "jadwalBaru"
            )
        ) || {};


    const container =
        document.getElementById(
            "jadwalList"
        );


    container.innerHTML = "";


    hari.forEach(
        function(namaHari) {


            const day =
                document.createElement(
                    "div"
                );


            day.className =
                "day";


            const title =
                document.createElement(
                    "h2"
                );


            title.textContent =
                "📚 " + namaHari;


            day.appendChild(
                title
            );


            const daftar =
                data[namaHari] || [];


            if (
                daftar.length === 0
            ) {


                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "empty";


                empty.textContent =
                    "Belum ada jadwal.";


                day.appendChild(
                    empty
                );


            }

            else {


                daftar.forEach(
                    function(item) {


                        const lesson =
                            document.createElement(
                                "div"
                            );


                        lesson.className =
                            "lesson";


                        const time =
                            document.createElement(
                                "div"
                            );


                        time.className =
                            "time";


                        time.textContent =
                            item.mulai +
                            " - " +
                            item.selesai;


                        const subject =
                            document.createElement(
                                "div"
                            );


                        subject.className =
                            "subject";


                        subject.textContent =
                            item.pelajaran;


                        lesson.appendChild(
                            time
                        );


                        lesson.appendChild(
                            subject
                        );


                        day.appendChild(
                            lesson
                        );

                    }
                );

            }


            container.appendChild(
                day
            );

        }
    );

}


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}

</script>

</body>

</html>
