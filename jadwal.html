<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jadwal Pelajaran</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 20px;

}

.container {

    width: 100%;

    max-width: 950px;

    margin: auto;

}

.box {

    background: white;

    border-radius: 22px;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow:
        0 15px 40px rgba(
            0,
            0,
            0,
            0.15
        );

}

.header {

    text-align: center;

}

.icon {

    font-size: 55px;

    margin-bottom: 10px;

}

.header h1 {

    color: #333;

    margin-bottom: 8px;

}

.header p {

    color: #777;

}

.pin-box {

    max-width: 450px;

    margin: 60px auto;

    text-align: center;

}

.pin-box input {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    text-align: center;

    font-size: 22px;

    letter-spacing: 5px;

}

button {

    width: 100%;

    padding: 13px;

    margin-top: 12px;

    border: none;

    border-radius: 10px;

    color: white;

    background: #667eea;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}

.back {

    background: #333;

}

.hidden {

    display: none;

}

.hari {

    margin-bottom: 20px;

}

.hari-title {

    font-size: 20px;

    font-weight: bold;

    color: #667eea;

    margin-bottom: 10px;

}

.item {

    background: #f6f7fb;

    border-left: 5px solid #667eea;

    border-radius: 12px;

    padding: 15px;

    margin-bottom: 10px;

}

.item-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

}

.mapel {

    font-size: 17px;

    font-weight: bold;

    color: #333;

}

.jam {

    font-weight: bold;

    color: #667eea;

    white-space: nowrap;

}

.guru {

    margin-top: 7px;

    color: #777;

    font-size: 13px;

}

.empty {

    text-align: center;

    padding: 35px;

    color: #777;

    background: #f6f7fb;

    border-radius: 15px;

}

.info {

    background: #f0f2ff;

    padding: 14px;

    border-radius: 10px;

    margin-bottom: 20px;

    color: #555;

    font-size: 13px;

}

@media(max-width:600px) {

    body {

        padding: 12px;

    }

    .box {

        padding: 18px;

    }

    .item-top {

        flex-direction: column;

        align-items: flex-start;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- PIN -->

<div
    id="pinPage"
    class="box pin-box"
>

    <div class="icon">
        🔐
    </div>

    <h1>
        Jadwal Pelajaran
    </h1>

    <p>
        Masukkan PIN untuk melihat jadwal
    </p>


    <input
        type="password"
        id="pin"
        maxlength="6"
        inputmode="numeric"
        placeholder="Masukkan PIN"
    >


    <button onclick="cekPIN()">

        🔓 MASUK JADWAL

    </button>


    <button
        class="back"
        onclick="kembaliDashboard()"
    >

        ← KEMBALI

    </button>

</div>


<!-- JADWAL -->

<div
    id="jadwalPage"
    class="hidden"
>


<div class="box header">

    <div class="icon">
        📅
    </div>

    <h1>
        Jadwal Pelajaran
    </h1>

    <p id="namaSekolah">
        Jadwal Sekolah
    </p>

</div>


<div class="box">


<div class="info">

📚 Berikut adalah jadwal pelajaran
yang telah kamu buat sendiri.

</div>


<div id="daftarJadwal">

</div>


<button
    class="back"
    onclick="kembaliDashboard()"
>

← KEMBALI KE DASHBOARD

</button>


</div>


</div>


</div>


<script>


/* =========================
   LOGIN
========================= */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* =========================
   DATA
========================= */

const data =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (!data) {

    window.location.href =
        "login.html";

}


/* =========================
   PIN
========================= */

function cekPIN() {

    const pin =
        document.getElementById(
            "pin"
        ).value;


    if (
        pin !== data.pinJadwal
    ) {

        alert(
            "❌ PIN Jadwal salah!"
        );

        return;

    }


    document.getElementById(
        "pinPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "jadwalPage"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "namaSekolah"
    ).textContent =
        data.sekolah ||
        "Jadwal Sekolah";


    tampilkanJadwal();

}


/* =========================
   TAMPIL JADWAL
========================= */

function tampilkanJadwal() {

    const container =
        document.getElementById(
            "daftarJadwal"
        );


    container.innerHTML = "";


    const jadwal =
        JSON.parse(
            localStorage.getItem(
                "jadwal"
            )
        ) || [];


    if (
        jadwal.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                📭 Belum ada jadwal.

                <br><br>

                Buka menu
                <b>Edit Jadwal</b>
                untuk menambahkan pelajaran.

            </div>

        `;

        return;

    }


    const urutanHari = [

        "Senin",

        "Selasa",

        "Rabu",

        "Kamis",

        "Jumat",

        "Sabtu"

    ];


    urutanHari.forEach(
        function(hari) {

            const dataHari =
                jadwal.filter(
                    function(item) {

                        return item.hari
                            === hari;

                    }
                );


            if (
                dataHari.length === 0
            ) {

                return;

            }


            dataHari.sort(
                function(a, b) {

                    return a.mulai.localeCompare(
                        b.mulai
                    );

                }
            );


            const section =
                document.createElement(
                    "div"
                );


            section.className =
                "hari";


            section.innerHTML = `

                <div class="hari-title">

                    📅 ${hari}

                </div>

            `;


            dataHari.forEach(
                function(item) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "item";


                    div.innerHTML = `

                        <div class="item-top">

                            <div class="mapel">

                                📚 ${escapeHTML(
                                    item.mapel
                                )}

                            </div>

                            <div class="jam">

                                🕐 ${escapeHTML(
                                    item.mulai
                                )}
                                -
                                ${escapeHTML(
                                    item.selesai
                                )}

                            </div>

                        </div>


                        <div class="guru">

                            👨‍🏫
                            ${
                                item.guru
                                ? escapeHTML(
                                    item.guru
                                )
                                : "Guru belum diisi"
                            }

                        </div>

                    `;


                    section.appendChild(
                        div
                    );

                }
            );


            container.appendChild(
                section
            );

        }
    );

}


/* =========================
   AMANKAN TEKS
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   KEMBALI
========================= */

function kembaliDashboard() {

    window.location.href =
        "dashboard.html";

}

</script>


</body>

</html>
