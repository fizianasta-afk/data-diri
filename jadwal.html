<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Pelajaran</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 800px;

            margin: auto;
        }

        /* PIN */

        .pin-box {
            background: white;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);
        }

        .pin-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        .pin-box h1 {
            margin-bottom: 10px;
        }

        .pin-box p {
            color: #777;

            margin-bottom: 25px;
        }

        .pin-input {
            width: 100%;

            padding: 15px;

            border: 2px solid #ddd;

            border-radius: 12px;

            text-align: center;

            font-size: 22px;

            letter-spacing: 8px;

            outline: none;
        }

        .pin-input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 12px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        /* JADWAL */

        #jadwalPage {
            display: none;
        }

        .header {
            background: white;

            padding: 25px;

            border-radius: 20px;

            margin-bottom: 20px;

            text-align: center;
        }

        .header h1 {
            color: #333;

            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        .jadwal-list {
            display: grid;

            gap: 15px;
        }

        .hari {
            background: white;

            padding: 20px;

            border-radius: 16px;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.1);
        }

        .hari h2 {
            margin-bottom: 12px;

            color: #667eea;
        }

        .pelajaran {
            padding: 12px;

            background: #f4f6fb;

            border-radius: 10px;

            margin-bottom: 8px;

            color: #444;
        }

        .back {
            background: #333;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- PIN -->

    <div
        class="pin-box"
        id="pinPage"
    >

        <div class="pin-icon">
            🔐
        </div>

        <h1>
            Jadwal Pelajaran
        </h1>

        <p>
            Masukkan PIN untuk melihat jadwal
        </p>

        <input
            type="password"
            id="pin"
            class="pin-input"
            maxlength="6"
            inputmode="numeric"
            placeholder="••••"
        >

        <button onclick="cekPIN()">
            🔓 BUKA JADWAL
        </button>

        <button
            class="back"
            onclick="kembali()"
        >
            ← KEMBALI
        </button>

    </div>


    <!-- JADWAL -->

    <div
        id="jadwalPage"
    >

        <div class="header">

            <h1>
                📅 Jadwal Pelajaran
            </h1>

            <p>
                Jadwal pelajaran kamu
            </p>

        </div>


        <div
            class="jadwal-list"
            id="jadwalList"
        >
        </div>


        <button
            class="back"
            onclick="kembali()"
        >
            ← KEMBALI KE DASHBOARD
        </button>

    </div>


</div>


<script>


/* CEK LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* CEK PIN */

function cekPIN() {

    const pin =
        document.getElementById("pin").value;

    const data =
        JSON.parse(
            localStorage.getItem("dataDiri")
        );


    if (!data) {

        alert(
            "❌ Data akun tidak ditemukan."
        );

        return;

    }


    if (pin === data.pinJadwal) {

        document.getElementById(
            "pinPage"
        ).style.display = "none";


        document.getElementById(
            "jadwalPage"
        ).style.display = "block";


        tampilkanJadwal();


    } else {

        alert(
            "❌ PIN Jadwal salah!"
        );

        document.getElementById(
            "pin"
        ).value = "";

    }

}


/* TAMPILKAN JADWAL */

function tampilkanJadwal() {

    const daftar =
        JSON.parse(
            localStorage.getItem("jadwal")
        ) || {};


    const hari = [
        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat"
    ];


    const container =
        document.getElementById(
            "jadwalList"
        );


    container.innerHTML = "";


    hari.forEach(function(namaHari) {

        const div =
            document.createElement("div");

        div.className = "hari";


        const h2 =
            document.createElement("h2");

        h2.textContent =
            "📚 " + namaHari;


        div.appendChild(h2);


        const pelajaran =
            daftar[namaHari] || [];


        if (pelajaran.length === 0) {

            const kosong =
                document.createElement("div");

            kosong.className =
                "pelajaran";

            kosong.textContent =
                "Belum ada jadwal.";

            div.appendChild(kosong);

        } else {

            pelajaran.forEach(function(item) {

                const p =
                    document.createElement("div");

                p.className =
                    "pelajaran";

                p.textContent =
                    item;

                div.appendChild(p);

            });

        }


        container.appendChild(div);

    });

}


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}


</script>

</body>

</html>
