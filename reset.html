<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Reset Data</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

}

.container {

    width: 100%;

    max-width: 500px;

}

.box {

    background: white;

    padding: 35px;

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(
            0,
            0,
            0,
            0.2
        );

}

.icon {

    font-size: 70px;

    margin-bottom: 15px;

}

h1 {

    color: #333;

    margin-bottom: 10px;

}

p {

    color: #777;

    line-height: 1.6;

}

.warning {

    background: #fff3cd;

    color: #856404;

    padding: 15px;

    border-radius: 12px;

    margin-top: 20px;

    text-align: left;

    font-size: 14px;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 11px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    color: white;

}

.delete {

    background: #e74c3c;

}

.delete:hover {

    background: #c0392b;

}

.back {

    background: #333;

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<div class="icon">
⚠️
</div>


<h1>
Reset Data
</h1>


<p>
Gunakan fitur ini jika kamu ingin
menghapus seluruh data website
dari browser ini.
</p>


<div class="warning">

<b>⚠️ PERINGATAN</b>

<br><br>

Data yang akan dihapus:

<br>
• Data diri
<br>
• Login
<br>
• Jadwal pelajaran
<br>
• Hasil karya Excel
<br>
• Foto profil

<br><br>

Data yang sudah dihapus
tidak dapat dikembalikan.

</div>


<button
    class="delete"
    onclick="resetSemuaData()"
>

🗑️ HAPUS SEMUA DATA

</button>


<button
    class="back"
    onclick="kembali()"
>

← KEMBALI

</button>


</div>

</div>


<script>


/* LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* RESET */

function resetSemuaData() {


    const pertama =
        confirm(
            "⚠️ Apakah kamu benar-benar ingin menghapus semua data?"
        );


    if (!pertama) {

        return;

    }


    const kedua =
        confirm(
            "PERINGATAN TERAKHIR!\n\nSemua data akan hilang. Lanjutkan?"
        );


    if (!kedua) {

        return;

    }


    /* LOCAL STORAGE */

    localStorage.clear();


    /* HAPUS DATA KARYA */

    const karyaRequest =
        indexedDB.open(
            "DataDiriDB",
            1
        );


    karyaRequest.onsuccess =
        function(event) {

            const db =
                event.target.result;


            if (
                db.objectStoreNames.contains(
                    "karya"
                )
            ) {

                const transaction =
                    db.transaction(
                        ["karya"],
                        "readwrite"
                    );


                const store =
                    transaction.objectStore(
                        "karya"
                    );


                store.clear();

            }

        };


    /* HAPUS FOTO */

    const fotoRequest =
        indexedDB.open(
            "DataDiriFotoDB",
            1
        );


    fotoRequest.onsuccess =
        function(event) {

            const db =
                event.target.result;


            if (
                db.objectStoreNames.contains(
                    "foto"
                )
            ) {

                const transaction =
                    db.transaction(
                        ["foto"],
                        "readwrite"
                    );


                const store =
                    transaction.objectStore(
                        "foto"
                    );


                store.clear();

            }

        };


    alert(
        "✅ Semua data berhasil dihapus."
    );


    setTimeout(
        function() {

            window.location.href =
                "index.html";

        },
        500
    );

}


/* KEMBALI */

function kembali() {

    window.location.href =
        "dashboard.html";

}

</script>

</body>

</html>
