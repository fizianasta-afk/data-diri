<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hasil Karya Excel</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 20px;

}

.container {

    width: 100%;

    max-width: 1000px;

    margin: auto;

}

.box {

    background: white;

    padding: 25px;

    border-radius: 22px;

    margin-bottom: 20px;

    box-shadow:
        0 15px 40px rgba(
            0,
            0,
            0,
            0.15
        );

}

.header {

    text-align: center;

}

.icon {

    font-size: 60px;

    margin-bottom: 10px;

}

.header h1 {

    color: #333;

    margin-bottom: 7px;

}

.header p {

    color: #777;

}

.pin {

    max-width: 450px;

    margin: 60px auto;

    text-align: center;

}

.pin input {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    text-align: center;

    font-size: 22px;

    letter-spacing: 5px;

}

button {

    width: 100%;

    padding: 13px;

    margin-top: 12px;

    border: none;

    border-radius: 10px;

    color: white;

    background: #667eea;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    opacity: 0.9;

}

.tambah {

    background: #2ecc71;

}

.hapus {

    background: #e74c3c;

}

.back {

    background: #333;

}

.form {

    background: #f6f7fb;

    padding: 20px;

    border-radius: 15px;

    margin-top: 20px;

}

label {

    display: block;

    margin-top: 12px;

    margin-bottom: 6px;

    font-weight: bold;

    color: #444;

}

input,
textarea {

    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 9px;

    outline: none;

}

textarea {

    resize: vertical;

    min-height: 90px;

}

.file {

    padding: 10px;

    background: white;

}

.karya {

    background: #f6f7fb;

    padding: 18px;

    border-radius: 15px;

    margin-top: 15px;

    border-left: 5px solid #667eea;

}

.karya-header {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    align-items: flex-start;

}

.karya-icon {

    font-size: 40px;

}

.karya h3 {

    color: #333;

    margin-bottom: 6px;

}

.karya p {

    color: #777;

    font-size: 13px;

    line-height: 1.5;

}

.file-name {

    margin-top: 10px;

    padding: 10px;

    background: white;

    border-radius: 8px;

    font-size: 13px;

    color: #555;

}

.karya-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 12px;

}

.karya-buttons button {

    margin-top: 0;

}

.download {

    background: #3498db;

}

.empty {

    text-align: center;

    padding: 45px 20px;

    color: #777;

    background: #f6f7fb;

    border-radius: 15px;

    margin-top: 15px;

}

.info {

    background: #f0f2ff;

    color: #555;

    padding: 15px;

    border-radius: 12px;

    font-size: 13px;

    line-height: 1.6;

}

.hidden {

    display: none;

}

@media(max-width:600px) {

    body {

        padding: 12px;

    }

    .box {

        padding: 18px;

    }

    .karya-header {

        flex-direction: column;

    }

    .karya-buttons {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     PIN
========================= -->

<div
    id="pinPage"
    class="box pin"
>

    <div class="icon">
        🔐
    </div>

    <h1>
        Hasil Karya Excel
    </h1>

    <p>
        Masukkan PIN Jadwal untuk membuka
    </p>


    <input
        type="password"
        id="pin"
        maxlength="6"
        inputmode="numeric"
        placeholder="Masukkan PIN"
    >


    <button onclick="cekPIN()">

        🔓 BUKA HASIL KARYA

    </button>


    <button
        class="back"
        onclick="dashboard()"
    >

        ← KEMBALI

    </button>

</div>


<!-- =========================
     HALAMAN KARYA
========================= -->

<div
    id="karyaPage"
    class="hidden"
>


<div class="box header">

    <div class="icon">
        📊
    </div>

    <h1>
        Hasil Karya Excel
    </h1>

    <p id="namaUser">
        Karya Saya
    </p>

</div>


<!-- TAMBAH -->

<div class="box">


<div class="info">

📁 Tambahkan hasil karya Excel kamu di sini.

<br><br>

File disimpan di browser ini menggunakan
penyimpanan lokal.

</div>


<div class="form">


<label>
Judul Karya
</label>

<input
    type="text"
    id="judul"
    placeholder="Contoh: Tabel Nilai Siswa"
>


<label>
Keterangan
</label>

<textarea
    id="keterangan"
    placeholder="Tulis keterangan karya..."
></textarea>


<label>
File Excel
</label>

<input
    type="file"
    id="file"
    class="file"
    accept=".xlsx,.xls,.csv"
>


<button
    class="tambah"
    onclick="simpanKarya()"
>

💾 SIMPAN KARYA

</button>


</div>

</div>


<!-- DAFTAR -->

<div class="box">

<h2>
📁 Daftar Karya
</h2>


<div id="daftarKarya">

</div>


<button
    class="back"
    onclick="dashboard()"
>

← KEMBALI KE DASHBOARD

</button>


</div>


</div>


</div>


<script>


/* =========================
   LOGIN
========================= */

if (
    localStorage.getItem("login")
    !== "true"
) {

    location.href =
        "login.html";

}


const user =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (!user) {

    location.href =
        "login.html";

}


/* =========================
   INDEXED DB
========================= */

let db;


const request =
    indexedDB.open(
        "DataDiriKaryaDB",
        1
    );


request.onupgradeneeded =
    function(event) {

        db =
            event.target.result;


        if (
            !db.objectStoreNames.contains(
                "karya"
            )
        ) {

            db.createObjectStore(
                "karya",
                {
                    keyPath: "id",
                    autoIncrement: true
                }
            );

        }

    };


request.onsuccess =
    function(event) {

        db =
            event.target.result;

    };


request.onerror =
    function() {

        alert(
            "❌ Penyimpanan karya tidak tersedia."
        );

    };


/* =========================
   PIN
========================= */

function cekPIN() {

    const pin =
        document.getElementById(
            "pin"
        ).value;


    if (
        pin !== user.pinJadwal
    ) {

        alert(
            "❌ PIN salah!"
        );

        return;

    }


    document.getElementById(
        "pinPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "karyaPage"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "namaUser"
    ).textContent =
        "Karya milik " +
        (user.nama || "Pengguna");


    tampilkanKarya();

}


/* =========================
   SIMPAN KARYA
========================= */

function simpanKarya() {

    const judul =
        document.getElementById(
            "judul"
        ).value.trim();


    const keterangan =
        document.getElementById(
            "keterangan"
        ).value.trim();


    const fileInput =
        document.getElementById(
            "file"
        );


    if (!judul) {

        alert(
            "⚠️ Judul karya belum diisi."
        );

        return;

    }


    if (
        fileInput.files.length === 0
    ) {

        alert(
            "⚠️ Pilih file Excel terlebih dahulu."
        );

        return;

    }


    const file =
        fileInput.files[0];


    const data = {

        judul:
            judul,

        keterangan:
            keterangan,

        namaFile:
            file.name,

        tipeFile:
            file.type,

        file:
            file,

        tanggal:
            new Date().toLocaleString(
                "id-ID"
            )

    };


    const transaction =
        db.transaction(
            ["karya"],
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    store.add(
        data
    );


    transaction.oncomplete =
        function() {

            alert(
                "✅ Karya berhasil disimpan!"
            );


            document.getElementById(
                "judul"
            ).value = "";


            document.getElementById(
                "keterangan"
            ).value = "";


            document.getElementById(
                "file"
            ).value = "";


            tampilkanKarya();

        };


    transaction.onerror =
        function() {

            alert(
                "❌ Gagal menyimpan karya."
            );

        };

}


/* =========================
   TAMPIL KARYA
========================= */

function tampilkanKarya() {

    if (!db) {

        setTimeout(
            tampilkanKarya,
            300
        );

        return;

    }


    const container =
        document.getElementById(
            "daftarKarya"
        );


    container.innerHTML = "";


    const transaction =
        db.transaction(
            ["karya"],
            "readonly"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    const request =
        store.getAll();


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                data.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        📭

                        <br><br>

                        Belum ada hasil karya.

                        <br><br>

                        Silakan tambahkan
                        file Excel pertama kamu.

                    </div>

                `;

                return;

            }


            data.reverse();


            data.forEach(
                karya => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "karya";


                    div.innerHTML = `

                        <div class="karya-header">

                            <div>

                                <h3>

                                    📊
                                    ${escapeHTML(
                                        karya.judul
                                    )}

                                </h3>

                                <p>

                                    ${escapeHTML(
                                        karya.keterangan ||
                                        "Tidak ada keterangan."
                                    )}

                                </p>

                            </div>

                            <div class="karya-icon">

                                📁

                            </div>

                        </div>


                        <div class="file-name">

                            📄
                            ${escapeHTML(
                                karya.namaFile
                            )}

                            <br>

                            🕐
                            ${escapeHTML(
                                karya.tanggal
                            )}

                        </div>


                        <div class="karya-buttons">

                            <button
                                class="download"
                                onclick="downloadKarya(${karya.id})"
                            >

                                ⬇️ DOWNLOAD

                            </button>


                            <button
                                class="hapus"
                                onclick="hapusKarya(${karya.id})"
                            >

                                🗑️ HAPUS

                            </button>

                        </div>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );

        };

}


/* =========================
   DOWNLOAD
========================= */

function downloadKarya(id) {

    const transaction =
        db.transaction(
            ["karya"],
            "readonly"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    const request =
        store.get(id);


    request.onsuccess =
        function() {

            const karya =
                request.result;


            const url =
                URL.createObjectURL(
                    karya.file
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href =
                url;


            a.download =
                karya.namaFile;


            document.body.appendChild(
                a
            );


            a.click();


            a.remove();


            URL.revokeObjectURL(
                url
            );

        };

}


/* =========================
   HAPUS
========================= */

function hapusKarya(id) {

    if (
        !confirm(
            "Hapus karya ini?"
        )
    ) {

        return;

    }


    const transaction =
        db.transaction(
            ["karya"],
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "karya"
        );


    store.delete(
        id
    );


    transaction.oncomplete =
        function() {

            alert(
                "🗑️ Karya berhasil dihapus."
            );


            tampilkanKarya();

        };

}


/* =========================
   AMANKAN HTML
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   DASHBOARD
========================= */

function dashboard() {

    location.href =
        "dashboard.html";

}

</script>


</body>

</html>
