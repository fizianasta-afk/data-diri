<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard Data Diri</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background: #f4f6fb;

            color: #222;

            transition: 0.3s;

        }

        body.dark {

            background: #121212;

            color: white;

        }


        /* HEADER */

        header {

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            padding: 25px;

            position: relative;

        }

        .header-content {

            width: 90%;

            max-width: 1100px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

        }

        header h1 {

            margin-bottom: 6px;

        }


        /* DARK MODE */

        .theme-btn {

            width: auto;

            padding: 10px 15px;

            margin: 0;

            background: rgba(
                255,
                255,
                255,
                0.2
            );

        }


        /* CONTAINER */

        .container {

            width: 90%;

            max-width: 1100px;

            margin: 30px auto;

        }


        /* PROFILE */

        .profile {

            background: white;

            padding: 25px;

            border-radius: 20px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px rgba(
                    0,
                    0,
                    0,
                    0.08
                );

            display: flex;

            align-items: center;

            gap: 25px;

        }

        body.dark .profile,
        body.dark .card {

            background: #1e1e1e;

        }

        .avatar {

            width: 90px;

            height: 90px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 40px;

            flex-shrink: 0;

        }

        .profile-info h2 {

            margin-bottom: 8px;

        }

        .profile-info p {

            color: #777;

        }

        body.dark .profile-info p {

            color: #bbb;

        }


        /* MENU */

        .menu {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;

        }


        /* CARD */

        .card {

            background: white;

            padding: 28px;

            border-radius: 20px;

            text-align: center;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(
                    0,
                    0,
                    0,
                    0.07
                );

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }

        .card:hover {

            transform:
                translateY(-7px);

            box-shadow:
                0 15px 35px rgba(
                    0,
                    0,
                    0,
                    0.12
                );

        }

        .icon {

            font-size: 50px;

            margin-bottom: 15px;

        }

        .card h3 {

            margin-bottom: 8px;

        }

        .card p {

            color: #777;

            font-size: 14px;

        }

        body.dark .card p {

            color: #bbb;

        }


        /* LOGOUT */

        .logout {

            width: 100%;

            padding: 15px;

            margin-top: 25px;

            border: none;

            border-radius: 12px;

            background: #e74c3c;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .logout:hover {

            background: #c0392b;

        }


        /* FOOTER */

        footer {

            text-align: center;

            color: #888;

            margin-top: 30px;

            padding-bottom: 20px;

            font-size: 13px;

        }


        /* MOBILE */

        @media(max-width:600px) {

            .header-content {

                flex-direction: column;

                text-align: center;

            }

            .profile {

                flex-direction: column;

                text-align: center;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="header-content">

        <div>

            <h1 id="sapaan">
                👋 Selamat Datang
            </h1>

            <p>
                Website Data Diri Kamu
            </p>

        </div>


        <button
            class="theme-btn"
            onclick="toggleTheme()"
        >

            🌙 Mode

        </button>

    </div>

</header>


<div class="container">


    <!-- PROFILE -->

    <div class="profile">

        <div class="avatar">

            👤

        </div>


        <div class="profile-info">

            <h2 id="nama">
                Nama
            </h2>

            <p>

                🏫
                <span id="sekolah">
                    Sekolah
                </span>

            </p>

            <p>

                🎯
                <span id="cita">
                    Cita-cita
                </span>

            </p>

            <p>

                🎮
                <span id="hobi">
                    Hobi
                </span>

            </p>

        </div>

    </div>


    <!-- MENU -->

    <div class="menu">


        <!-- JADWAL -->

        <div
            class="card"
            onclick="bukaJadwal()"
        >

            <div class="icon">
                📅
            </div>

            <h3>
                Jadwal Pelajaran
            </h3>

            <p>
                Lihat jadwal pelajaran
            </p>

        </div>


        <!-- EDIT -->

        <div
            class="card"
            onclick="editJadwal()"
        >

            <div class="icon">
                ✏️
            </div>

            <h3>
                Edit Jadwal
            </h3>

            <p>
                Atur jadwal pelajaran
            </p>

        </div>


        <!-- EXCEL -->

        <div
            class="card"
            onclick="bukaKarya()"
        >

            <div class="icon">
                📊
            </div>

            <h3>
                Hasil Karya Excel
            </h3>

            <p>
                Simpan dan lihat karya Excel
            </p>

        </div>


        <!-- PROFIL -->

        <div
            class="card"
            onclick="bukaProfil()"
        >

            <div class="icon">
                👤
            </div>

            <h3>
                Edit Data Diri
            </h3>

            <p>
                Ubah informasi diri
            </p>

        </div>


    </div>


    <!-- LOGOUT -->

    <button
        class="logout"
        onclick="logout()"
    >

        🚪 KELUAR

    </button>


    <footer>

        Website Data Diri © 2026

    </footer>


</div>


<script>


/* CEK LOGIN */

if (
    localStorage.getItem("login")
    !== "true"
) {

    window.location.href =
        "login.html";

}


/* DATA */

const data =
    JSON.parse(
        localStorage.getItem(
            "dataDiri"
        )
    );


if (data) {

    document.getElementById(
        "nama"
    ).textContent =
        data.nama;


    document.getElementById(
        "sekolah"
    ).textContent =
        data.sekolah;


    document.getElementById(
        "cita"
    ).textContent =
        data.cita;


    document.getElementById(
        "hobi"
    ).textContent =
        data.hobi;


    document.getElementById(
        "sapaan"
    ).textContent =
        "👋 Halo, " +
        data.nama;

}


/* JADWAL */

function bukaJadwal() {

    window.location.href =
        "jadwal.html";

}


/* EDIT JADWAL */

function editJadwal() {

    window.location.href =
        "edit-jadwal.html";

}


/* KARYA */

function bukaKarya() {

    window.location.href =
        "karya.html";

}


/* PROFIL */

function bukaProfil() {

    window.location.href =
        "profil.html";

}


/* LOGOUT */

function logout() {

    localStorage.removeItem(
        "login"
    );

    window.location.href =
        "login.html";

}


/* DARK MODE */

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );


    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        localStorage.setItem(
            "theme",
            "dark"
        );

    } else {

        localStorage.setItem(
            "theme",
            "light"
        );

    }

}


/* LOAD THEME */

if (
    localStorage.getItem(
        "theme"
    ) === "dark"
) {

    document.body.classList.add(
        "dark"
    );

}


</script>


</body>

</html>
